[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chess-banter"
  to = "/.netlify/functions/chess-banter"
  status = 200

[[redirects]]
  from = "/api/ops"
  to = "/.netlify/functions/ops"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
