[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chess-banter"
  to = "/.netlify/functions/chess-banter"
  status = 200

[[redirects]]
  from = "/api/ops"
  to = "/.netlify/functions/ops"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Replaces the proxied app's x-robots-tag: noindex. Canonical URL stays the app's own.
[[headers]]
  for = "/astrology"
  [headers.values]
    X-Robots-Tag = "all"

[[headers]]
  for = "/astrology/*"
  [headers.values]
    X-Robots-Tag = "all"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.emailjs.com https://cloudflareinsights.com https://static.cloudflareinsights.com https://cdn.plot.ly; worker-src 'self' blob:; frame-src https://harieshwar-ai.github.io https://trackmyhabit.netlify.app; media-src 'self' blob:; form-action 'self'"

